<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produits</title>
    <style>body{font-family:Arial,sans-serif;margin:2rem;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f4f4f4;}</style>
</head>
<body>
<h1>Liste des produits</h1>
<table>
<thead><tr><th>ID</th><th>Nom</th><th>Description</th><th>Prix</th><th>Catégorie</th></tr></thead>
<tbody>
<tr th:each="p : ${products}">
    <td th:text="${p.id}"></td>
    <td th:text="${p.name}"></td>
    <td th:text="${p.description}"></td>
    <td th:text="${p.price}"></td>
    <td th:text="${p.category != null ? p.category.name : '-'}"></td>
</tr>
</tbody>
</table>
<p><a href="/categories">Voir les catégories</a></p>
</body>
</html>
